experiment_name: cnn
model: cnn

data:
  data_root: data/imagenette2-160
  train_manifest: configs/train.csv
  val_manifest: configs/val.csv
  test_manifest: configs/test.csv
  image_size: 160
  rgb: true
  pixel_range: [0.0, 1.0]
  horizontal_flip_train: false

training:
  seed: 42
  epochs: 20
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0
  loss: cross_entropy
  optimizer: adam
  pretrained_weights: false
  num_workers: 0
